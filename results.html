body{margin:0;background:#0B0B0B}
.cx{position:relative;isolation:isolate;--ink:#0B0B0B;--paper:#ECEAE5;--paper2:#F7F6F2;--grey:#5E5E5E;--red:#D10000;color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--paper) url(assets/v2-grunge-light.webp) 0 0/1200px repeat;overflow:hidden}
