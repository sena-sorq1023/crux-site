<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
a:focus-visible,button:focus-visible{outline:2px solid #D10000;outline-offset:3px}
body{margin:0;background:#0B0B0B}
.cx{position:relative;isolation:isolate;--ink:#0B0B0B;--paper:#ECEAE5;--paper2:#F7F6F2;--grey:#5E5E5E;--red:#D10000;color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--paper) url(assets/v2-grunge-light.webp) 0 0/1200px repeat;overflow:hidden}
.cx a{color:inherit}
.cx a:hover{opacity:.72}
.cx img{max-width:100%}
.wrap{max-width:1280px;margin:0 auto;padding-left:32px;padding-right:32px}
.dark{background:#0B0B0B url(assets/v2-grunge-dark.webp) 0 0/1200px repeat;color:#F7F6F2}
.light{background:var(--paper) url(assets/v2-grunge-light.webp) 0 0/1200px repeat}
.st{font-family:'Saira Stencil One',sans-serif;font-weight:400;letter-spacing:.01em}
.cd{font-family:'Saira Condensed',sans-serif}
.red{color:var(--red)}
.hd{position:relative;z-index:5;border-bottom:3px solid var(--ink)}
.hd nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-top:10px;padding-bottom:10px}
.hd .menu{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.hd .menu a{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:17px;letter-spacing:.12em;text-decoration:none;padding:10px 12px}
.hd .menu a.on{background:var(--ink);color:var(--paper2)}
.hd .menu a.watch{margin-left:8px;border:2px solid var(--ink);padding:8px 16px;display:inline-flex;align-items:center;gap:8px}
.tape{display:inline-block;align-self:flex-start;background:var(--ink);color:var(--paper2);font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.22em;padding:6px 14px;transform:rotate(-2deg)}
.dark .tape{background:var(--paper2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 30px 0 24px;font-family:'Saira Condensed','Noto Sans JP',sans-serif;font-weight:800;font-size:17px;letter-spacing:.08em;text-decoration:none;background:var(--ink);color:var(--paper2) !important;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.dark .btn{background:var(--paper2);color:var(--ink) !important}
.btn.line{background:transparent;color:inherit !important;border:2px solid currentColor;clip-path:none;padding:0 24px}
.card{background:var(--paper2);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.sec{padding-top:104px}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:36px}
.sec-h h2{margin:0;font-family:'Saira Stencil One',sans-serif;font-weight:400;font-size:clamp(44px,6vw,80px);line-height:.95}
.more{font-family:'Saira Condensed','Noto Sans JP',sans-serif;font-weight:800;font-size:16px;letter-spacing:.08em;padding:10px 0}
.slant{clip-path:polygon(0 56px,100% 0,100% 100%,0 100%);padding-top:140px !important}
.slant-b{clip-path:polygon(0 0,100% 0,100% calc(100% - 56px),0 100%)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.16em;text-align:left;padding:12px 16px;background:var(--ink);color:var(--paper2)}
.tbl td{padding:14px 16px;border-bottom:1px solid #BEBBB3}
.num{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.ph{color:#8C8A85}
.chip{font-family:'Saira Condensed','Noto Sans JP',sans-serif;font-weight:800;font-size:13px;letter-spacing:.16em;padding:3px 10px;border:2px solid var(--ink)}
.chip.k{background:var(--ink);color:var(--paper2)}
.win{display:inline-flex;align-items:center;gap:6px;font-family:'Saira Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:.2em;color:var(--red)}
.win img{width:18px;height:18px}
.ft{border-top:3px solid var(--ink)}
.ft a{color:#BDBBB5;text-decoration:none;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;padding:12px 0}
@keyframes cx-pan{from{transform:translate3d(0,0,0)}to{transform:translate3d(-1200px,-1200px,0)}}
@keyframes cx-pan2{from{transform:translate3d(-1200px,0,0)}to{transform:translate3d(0,-1200px,0)}}
@keyframes cx-tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes cx-dust{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(60px,-110vh);opacity:0}}
@keyframes cx-smoke{0%,100%{opacity:.35}50%{opacity:.6}}
.mv{position:absolute;top:0;left:0;width:calc(100% + 1200px);height:calc(100% + 1200px);background-repeat:repeat;background-size:1200px;pointer-events:none;will-change:transform}
.iso{position:relative;isolation:isolate;overflow:hidden}
@keyframes cx-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes cx-flick{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.35}96%{opacity:1}}
@media (prefers-reduced-motion: reduce){.cx-anim{animation:none !important}}
@media (max-width:900px){.hero-star{opacity:.18}}
@media (max-width:1100px){.rm-arrow{flex-basis:100%!important;text-align:center;transform:rotate(90deg)}}
@media (max-width:640px){.wrap{padding-left:16px;padding-right:16px}.hd .menu a{font-size:15px;padding:10px 8px}.hd .menu a.watch{margin-left:0}.sec{padding-top:72px}.card{box-shadow:5px 5px 0 var(--ink)}}
