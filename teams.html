<script>
class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; } }
function cruxMount(Component, tplId, rootId) {
  var comp = new Component({}); comp.state = comp.state || {};
  var tpl = document.getElementById(tplId), root = document.getElementById(rootId);
  function resolve(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    var parts = path.split('.'), v;
    for (var i = 0; i < scope.length; i++) { if (scope[i] && parts[0] in scope[i]) { v = scope[i]; break; } }
    if (v === undefined) return undefined;
    for (var j = 0; j < parts.length; j++) { if (v == null) return undefined; v = v[parts[j]]; }
    return v;
  }
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function interp(str, scope) { return str.replace(HOLE, function (m, p) { var v = resolve(p, scope); return v == null ? '' : String(v); }); }
  function build(src, scope, parent) {
    var kids = src.childNodes;
    for (var k = 0; k < kids.length; k++) {
      var ch = kids[k];
      if (ch.nodeType === 3) { parent.appendChild(document.createTextNode(interp(ch.nodeValue, scope))); continue; }
      if (ch.nodeType !== 1) continue;
      if (ch.tagName === 'TEMPLATE' && ch.hasAttribute('data-for')) {
        var list = resolve(ch.getAttribute('data-for'), scope) || [], as = ch.getAttribute('data-as');
        for (var n = 0; n < list.length; n++) { var s = {}; s[as] = list[n]; build(ch.content, [s].concat(scope), parent); }
        continue;
      }
      if (ch.tagName === 'TEMPLATE' && ch.hasAttribute('data-if')) {
        if (resolve(ch.getAttribute('data-if'), scope)) build(ch.content, scope, parent);
        continue;
      }
      var el = ch.cloneNode(false), attrs = Array.prototype.slice.call(ch.attributes);
      for (var a = 0; a < attrs.length; a++) {
        var nm = attrs[a].name, val = attrs[a].value;
        if (val.indexOf('{{') < 0) continue;
        if (nm.indexOf('on') === 0) {
          el.removeAttribute(nm);
          var fn = resolve(val.replace(/^\s*\{\{\s*|\s*\}\}\s*$/g, ''), scope);
          if (typeof fn === 'function') el.addEventListener(nm.slice(2), fn);
        } else el.setAttribute(nm, interp(val, scope));
      }
      build(ch.tagName === 'TEMPLATE' ? ch.content : ch, scope, el);
      parent.appendChild(el);
    }
  }
  function render() {
    var vals = comp.renderVals(), frag = document.createDocumentFragment();
    build(tpl.content, [vals], frag);
    root.textContent = ''; root.appendChild(frag);
  }
  comp.setState = function (p) { for (var key in p) comp.state[key] = p[key]; render(); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && comp.state.open) comp.setState({ open: null }); });
  render();
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { season: 0, stage: 1, open: null };
  }
  renderVals() {

      close: function () { self.setState({ open: null }); }, d: { tiles: [], maps: [], players: [] } };

    if (st.open) {
      var t = st.open, f1 = function (x) { return (Math.round(x * 10) / 10).toFixed(1); };
      var did = dataIdOf(t) || ev.id;
      d = DATA[did] || {};
      overall = (d.all && d.all.rows) || [];
      var mkeys = Object.keys(d).filter(function (k) { return k.charAt(0) === 'm'; });
      var kills = 0, played = 0, byMap = {}, order = [];
      mkeys.forEach(function (k) {
        var m = d[k]; m.rows.forEach(function (r) {
          if (r[0] !== t) return;
          kills += r[2]; played++;
          if (!m.map) return;
          if (!byMap[m.map]) { byMap[m.map] = { k: 0, n: 0 }; order.push(m.map); }
          byMap[m.map].k += r[2]; byMap[m.map].n++;
        });
      });
      var rank = '—', killRank = '—', wwcd = '—';
      overall.forEach(function (r, i) { if (r[0] === t) { rank = '#' + (i + 1); wwcd = String(r[1]); } });
      if (overall.length) {
        var byKill = overall.slice().sort(function (a, b) { return b[3] - a[3]; });
        byKill.forEach(function (r, i) { if (r[0] === t) killRank = (i + 1) + '位 / ' + byKill.length + 'チーム'; });
      }
      var maxAvg = 0;
      order.forEach(function (mp) { maxAvg = Math.max(maxAvg, byMap[mp].k / byMap[mp].n); });
      var maps = order.map(function (mp) {
        var a = byMap[mp].k / byMap[mp].n;
        return { name: mp, avg: f1(a), w: (maxAvg ? Math.round(a / maxAvg * 100) : 0) + '%' };
      });
      // 選手：[選手名, [マッチごとのキル（出場していないマッチは null）]]
      var mapOfIdx = function (i) { var m = d['m' + (i + 1)]; return m ? m.map : null; };
      var stat = function (p) {
        var k = 0, n = 0, pm = {};
        p[1].forEach(function (v, i) {
          if (v === null || v === undefined) return;
          k += v; n++;
          var mp = mapOfIdx(i); if (mp) { if (!pm[mp]) pm[mp] = { k: 0, n: 0 }; pm[mp].k += v; pm[mp].n++; }
        });
        return { name: p[0], k: k, n: n, pm: pm };
      };
      var allP = [];
      var evP = PLAYERS[did] || {};
      Object.keys(evP).forEach(function (tn) { evP[tn].forEach(function (p) { allP.push(stat(p).k); }); });
      var gRank = function (k) { var r = 1; allP.forEach(function (x) { if (x > k) r++; }); return r; };
      var pls = (evP[t] || []).map(stat).sort(function (a, b) { return (b.k - a.k) || (b.n - a.n); });
      var pcols = ['KILL', 'MATCH', 'AVG'].concat(order).concat(['全体']);
      var players = pls.length ? pls.map(function (p, i) {
        var none = p.n === 0;
        var vals = [none ? '—' : String(p.k), String(p.n), none ? '—' : f1(p.k / p.n)];
        order.forEach(function (mp) { vals.push(p.pm[mp] ? f1(p.pm[mp].k / p.pm[mp].n) : '—'); });
        vals.push(none ? '—' : '#' + gRank(p.k));
        return { rank: none ? '—' : String(i + 1), name: p.name, vals: vals, color: none ? '#8C8A85' : '#0B0B0B', bg: i === 0 && !none ? 'rgba(209,0,0,.07)' : 'transparent' };
      }) : [1, 2, 3, 4].map(function (i) {
        var vals = ['—', '—', '—'].concat(order.map(function () { return '—'; })).concat(['—']);
        return { rank: String(i), name: '[選手名]', vals: vals, color: '#8C8A85', bg: 'transparent' };
      });
      var lg = logoOf(t);
      out.d = { name: t, event: EVENTS[si].season + ' · ' + ev.label, champion: t === ev.champion,
        logo: lg.src, logoSize: lg.own ? '76px' : '40px',
        tiles: [
          { label: '総合順位', value: rank, note: ev.label + (ev.dataLabels && ev.dataLabels[did] ? ' · ' + ev.dataLabels[did] : '') },
          { label: '合計キル', value: played ? String(kills) : '—', note: 'キル数 ' + killRank },
          { label: '平均キル', value: played ? f1(kills / played) : '—', note: played ? played + 'マッチ' : '' },
          { label: 'ドン勝', value: wwcd, note: 'WWCD' }
        ],
        hasMaps: maps.length > 0, noMaps: maps.length === 0, maps: maps, noMapMsg: played ? 'この大会はマップ別のデータがありません。' : '成績データの準備中です。',
        mapNote: order.map(function (mp) { return mp + ' ' + byMap[mp].n + 'マッチ'; }).join('　'),
        players: players, pcols: pcols, showPlayers: ev.players !== false };
    }
    return out;
  }
}
cruxMount(Component, "crux-tpl", "crux-root");
</script>
