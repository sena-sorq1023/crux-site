<style>
:root{--bg:#070708;--ink:#F4F2EF;--sub:#A9A7A3;--dim:#6F6C68;--line:#2B2B2E;--red:#E0262B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--ink)}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column}
a{color:inherit}

/* 背景：グリッド＋赤い光＋走査線＋ノイズ */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 55% at 50% 44%,rgba(196,18,24,.30),rgba(110,8,12,.08) 55%,transparent 80%),
  radial-gradient(ellipse 120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.noise{position:fixed;inset:-50%;pointer-events:none;z-index:4;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-6%,4%)}50%{transform:translate(5%,-7%)}75%{transform:translate(-3%,-5%)}100%{transform:translate(0,0)}}
.bar{position:fixed;left:0;right:0;height:0;z-index:5;pointer-events:none;background:rgba(244,242,239,.5);mix-blend-mode:difference}

.frame{position:fixed;inset:20px;border:1px solid rgba(224,38,43,.35);pointer-events:none;z-index:2}
header,footer{position:relative;z-index:6;display:flex;justify-content:space-between;gap:16px;padding:36px 44px 0;
  font-family:'transducer-variable','Archivo',sans-serif;font-stretch:115%;font-weight:400;font-size:12px;line-height:1.4;letter-spacing:.16em;color:var(--sub)}
footer{padding:0 44px 28px;justify-content:center;color:#55524F;letter-spacing:.12em;font-size:9px;text-align:center}
.rec{display:inline-flex;align-items:center;gap:8px;color:var(--red)}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

main{position:relative;max-width:100vw;overflow:hidden;z-index:6;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:48px 16px;text-align:center}
.mark{width:150px;height:auto;display:block;animation:flick 6s infinite}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.2}43%{opacity:1}44%{opacity:.4}45%{opacity:1}78%{opacity:1}79%{opacity:.1}80%{opacity:1}}

.season{font-family:'transducer-variable','Archivo',sans-serif;font-stretch:125%;font-weight:700;font-size:15px;line-height:1;letter-spacing:.1em;color:#D7B57A;display:flex;align-items:center;gap:18px}
.season::before,.season::after{content:"";width:64px;height:1px;background:#4A4A4D}

/* COMING SOON のグリッチ */
.glitch{position:relative;margin:0;font-family:'transducer-variable','Archivo',sans-serif;font-stretch:125%;font-weight:900;
  font-size:clamp(34px,8.6vw,132px);max-width:100%;line-height:.92;letter-spacing:-.01em;white-space:nowrap;
  background:linear-gradient(180deg,#FFFFFF 0%,#E9E7E3 55%,#9C9A96 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{-webkit-text-fill-color:#FF2A2F;color:#FF2A2F;mix-blend-mode:screen;transform:translate(-3px,0);clip-path:inset(0 0 100% 0);animation:g1 3.2s infinite steps(1)}
.glitch::after{-webkit-text-fill-color:#28E0F0;color:#28E0F0;mix-blend-mode:screen;transform:translate(3px,0);clip-path:inset(100% 0 0 0);animation:g2 3.2s infinite steps(1)}
@keyframes g1{0%,58%,100%{clip-path:inset(0 0 100% 0);transform:translate(0)}
  60%{clip-path:inset(12% 0 64% 0);transform:translate(-10px,-2px)}62%{clip-path:inset(58% 0 20% 0);transform:translate(8px,1px)}
  64%{clip-path:inset(30% 0 46% 0);transform:translate(-6px,0)}66%{clip-path:inset(0 0 100% 0)}
  88%{clip-path:inset(70% 0 8% 0);transform:translate(12px,0)}90%{clip-path:inset(0 0 100% 0)}}
@keyframes g2{0%,58%,100%{clip-path:inset(100% 0 0 0);transform:translate(0)}
  60%{clip-path:inset(44% 0 34% 0);transform:translate(10px,2px)}62%{clip-path:inset(8% 0 72% 0);transform:translate(-8px,-1px)}
  64%{clip-path:inset(76% 0 4% 0);transform:translate(6px,0)}66%{clip-path:inset(100% 0 0 0)}
  88%{clip-path:inset(20% 0 60% 0);transform:translate(-12px,0)}90%{clip-path:inset(100% 0 0 0)}}
.glitch.burst{animation:shake .32s steps(2) 1}
.glitch.burst::before{animation:g1 .32s steps(1) 1;animation-delay:-1.9s}
.glitch.burst::after{animation:g2 .32s steps(1) 1;animation-delay:-1.9s}
@keyframes shake{0%{transform:translate(0) skewX(0)}25%{transform:translate(-8px,2px) skewX(-8deg)}50%{transform:translate(6px,-1px) skewX(6deg)}75%{transform:translate(-3px,0) skewX(-2deg)}100%{transform:translate(0) skewX(0)}}

.reveal{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.reveal .lbl{font-family:'transducer-variable','Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:12px;line-height:1;letter-spacing:.3em;color:var(--red)}
.reveal .txt{font-family:'transducer-variable','Archivo','Noto Sans JP',sans-serif;font-stretch:115%;font-weight:600;font-size:14px;line-height:1.7;color:#D9D6D1;letter-spacing:.04em}
.reveal .meta{display:flex;gap:14px;align-items:center;font-family:'transducer-variable','Archivo',sans-serif;font-stretch:115%;font-weight:500;font-size:12px;line-height:1;letter-spacing:.12em;color:var(--sub)}
.reveal .meta i{width:1px;height:10px;background:#4A4A4D}
.reveal .meta a{text-decoration:none}
.reveal .meta a:hover{color:var(--ink)}
.redact{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.redact span{display:block;height:14px;background:#232326;transform:skewX(-12deg);position:relative;overflow:hidden}
.redact span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:sweep 2.6s infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

@media (max-width:720px){
  header{padding:30px 28px 0;font-size:10px}
  footer{padding:0 28px 34px}
  .frame{inset:12px}
  .mark{width:112px}
}
@media (prefers-reduced-motion:reduce){
  .noise,.mark,.rec::before,.redact span::after,.glitch::before,.glitch::after{animation:none}
}
</style>

<div class="redact" aria-hidden="true"><span style="width:180px"></span><span style="width:90px"></span><span style="width:140px"></span></div>
<div class="reveal">
<span class="lbl">REVEAL</span>
<span class="txt">CRUX INVITATION 2026 MAIN EVENT DAY4 配信内にて発表</span>
<span class="meta"><span>2026.12.27 SUN</span><i></i><a href="https://www.youtube.com/@_PMSB_">YOUTUBE.COM/@_PMSB_</a></span>
</div>
</main>

<footer>© 2026 SENA STUDIO. CRUX PROJECT is a brand of SENA STUDIO.</footer>

<script>
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var g = document.getElementById('g'), bar = document.getElementById('bar');
  // ときどき「じじっ」と乱れる
  function burst(){
    g.classList.remove('burst'); void g.offsetWidth; g.classList.add('burst');
    var n = 2 + Math.floor(Math.random()*3), i = 0;
    (function tick(){
      bar.style.top = (Math.random()*100) + 'vh';
      bar.style.height = (1 + Math.random()*2) + 'px';
      bar.style.opacity = .18 + Math.random()*.22;
      if (++i < n) setTimeout(tick, 45 + Math.random()*60);
      else setTimeout(function(){ bar.style.height = 0; }, 60);
    })();
    setTimeout(burst, 1400 + Math.random()*2600);
  }
  setTimeout(burst, 900);
})();
</script>
</body>
